<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administração | Otimizador de Grade</title>
<style>body{font-family:system-ui,Arial;background:#f2f6fc;color:#172b49;margin:0}header{background:#152c52;color:white;padding:24px max(18px,calc((100vw - 1060px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:25px;margin:0}main{max-width:1060px;margin:28px auto;padding:0 18px}.card{background:white;padding:24px;border-radius:15px;box-shadow:0 6px 24px #142b5114}button{border:0;background:#245fc4;color:white;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600}button:disabled{opacity:.5}.reject{background:#a22d37}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e1e8f0;font-size:14px}.scroll{overflow-x:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}#msg{min-height:22px}small{color:#637189}</style></head>
<body><header><h1>Administração · Solicitações de professores</h1><button id="sair">Sair</button></header>
<main><section class="card"><p id="saudacao"></p><p>Analise os pedidos de acesso. A aprovação libera o painel de professores para a conta solicitante.</p><p id="msg" role="status"></p>
<div class="scroll"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Solicitado em</th><th>Status</th><th>Ação</th></tr></thead><tbody id="pedidos"></tbody></table></div>
<small>A notificação por e-mail serve como aviso. A aprovação ocorre somente aqui, após autenticação administrativa.</small>
</section></main>
<script type="module">
import {supabase,requireRole,logout} from './auth.js';
const $=id=>document.getElementById(id);$('sair').onclick=logout;
const perfil=await requireRole('admin');
if(perfil){
 $('saudacao').textContent='Bem-vindo(a), '+perfil.nome+'.';
 async function carregar(){
  const {data,error}=await supabase.rpc('listar_solicitacoes_professor');
  if(error){$('msg').textContent='Erro: '+error.message;return;}
  $('pedidos').replaceChildren();
  if(!data.length){$('msg').textContent='Nenhuma solicitação encontrada.';return;}
  $('msg').textContent=data.filter(x=>x.status==='pendente').length+' solicitação(ões) pendente(s).';
  for(const pedido of data){
   const tr=document.createElement('tr');
   for(const v of [pedido.nome,pedido.email,new Date(pedido.created_at).toLocaleString('pt-BR'),pedido.status]){
    const td=document.createElement('td');td.textContent=String(v);tr.append(td);
   }
   const td=document.createElement('td');
   if(pedido.status==='pendente'){
    const actions=document.createElement('div');actions.className='actions';
    for(const [label,approve] of [['Aprovar',true],['Rejeitar',false]]){
     const btn=document.createElement('button');btn.textContent=label;if(!approve)btn.className='reject';
     btn.onclick=async()=>{
      if(!confirm((approve?'Aprovar':'Rejeitar')+' acesso de '+pedido.nome+'?'))return;
      actions.querySelectorAll('button').forEach(b=>b.disabled=true);
      const {error}=await supabase.rpc('analisar_solicitacao_professor',{p_id:pedido.id,p_aprovar:approve});
      if(error){$('msg').textContent='Erro: '+error.message;actions.querySelectorAll('button').forEach(b=>b.disabled=false);}
      else await carregar();
     };actions.append(btn);
    }td.append(actions);
   }else td.textContent='Analisada';
   tr.append(td);$('pedidos').append(tr);
  }
 }
 await carregar();
}
</script></body></html>
